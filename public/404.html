<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — الصفحة غير موجودة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cairo', sans-serif;
      background: #070e1a;
      color: white;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }
    
    /* Background orbs (reused from login) */
    .orb { position: absolute; border-radius: 50%; filter: blur(80px); pointer-events: none; opacity: 0.5; }
    .orb-1 { width: 400px; height: 400px; background: #0f3a5a; top: -100px; right: -100px; }
    .orb-2 { width: 300px; height: 300px; background: #5ba15d; bottom: -50px; left: -50px; opacity: 0.3; }

    .container {
      position: relative;
      z-index: 10;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 48px;
      max-width: 420px;
      width: 100%;
      backdrop-filter: blur(20px);
    }

    h1 {
      font-size: 80px;
      font-weight: 900;
      background: linear-gradient(135deg, #5ba15d, #34d399);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 10px;
    }

    h2 { font-size: 20px; font-weight: 700; margin-bottom: 16px; color: #f1f5f9; }
    p { font-size: 14px; color: #94a3b8; margin-bottom: 32px; line-height: 1.5; }

    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #5ba15d, #2e7d32);
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(91,161,93,0.3);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(91,161,93,0.4); }
  </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="container">
  <h1>404</h1>
  <h2>عذراً، الصفحة غير موجودة</h2>
  <p>يبدو أنك وصلت إلى رابط غير صحيح أو تم نقل هذه الصفحة. يرجى العودة إلى الصفحة الرئيسية للمتابعة.</p>
  <a href="/admin/dashboard.html" class="btn">العودة إلى لوحة التحكم</a>
</div>

</body>
</html>
