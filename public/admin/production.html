<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus ERP — Production Planning (PP)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#f1f5f9;color:#1e293b}
    main{padding:28px 32px}

    /* KPI cards */
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
    .kpi{border-radius:14px;padding:18px 20px}
    .kpi.accent{background:linear-gradient(135deg,#e57e25,#c65e0a);color:white}
    .kpi.white{background:white;box-shadow:0 2px 10px rgba(0,0,0,.06)}
    .kpi-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.7;margin-bottom:6px}
    .kpi-val{font-size:26px;font-weight:900;color:#0f3a5a}
    .kpi.accent .kpi-val{color:white}

    /* Cards */
    .card{background:white;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:20px}
    .card-title{font-size:14px;font-weight:700;color:#0f3a5a;margin-bottom:16px;display:flex;align-items:center;gap:8px}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
    @media(max-width:700px){.grid-2{grid-template-columns:1fr}}

    /* Table */
    .tbl{width:100%;border-collapse:collapse;font-size:13px}
    .tbl th{background:#f8fafc;color:#64748b;font-weight:700;font-size:11px;text-transform:uppercase;padding:9px 12px;text-align:left;border-bottom:1px solid #e2e8f0}
    .tbl td{padding:10px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
    .tbl tr:hover td{background:#fafafa}
    .tbl tr:last-child td{border-bottom:none}

    /* Badge */
    .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
    .badge-plan{background:#e0f2fe;color:#0369a1}
    .badge-wip{background:#fef3c7;color:#b45309}
    .badge-done{background:#dcfce7;color:#15803d}
    .badge-hold{background:#fee2e2;color:#b91c1c}

    /* Progress bar */
    .pbar-bg{background:#e2e8f0;border-radius:10px;height:8px;overflow:hidden;width:100%}
    .pbar-fg{height:100%;border-radius:10px;transition:width .4s}

    /* BOM tree */
    .bom-tree{background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0;padding:16px;font-size:13px}
    .bom-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed #e2e8f0}
    .bom-row:last-child{border-bottom:none}
    .bom-l1{font-weight:700;color:#0f3a5a}
    .bom-l2{margin-left:20px;color:#64748b;font-size:12px}

    /* Header */
    .page-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
    .btn{border:none;border-radius:10px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
    .btn-orange{background:#e57e25;color:white}
    .btn-orange:hover{background:#c65e0a}
    .btn-ghost{background:#f1f5f9;color:#0f3a5a}
    .btn-ghost:hover{background:#e2e8f0}

    /* Spinner */
    .spin{display:inline-block;width:16px;height:16px;border:2px solid #e2e8f0;border-top-color:#e57e25;border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<main>
  <!-- Header -->
  <div class="page-hdr">
    <div>
      <h1 style="font-size:22px;font-weight:900;color:#0f3a5a;">🏭 Production Planning &amp; Control (PP)</h1>
      <p style="font-size:13px;color:#64748b;margin-top:4px;">BOM, production orders &amp; work center capacity</p>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-ghost" onclick="loadData()">↺ Refresh</button>
      <button class="btn btn-orange" onclick="openNewOrderModal()">+ Production Order</button>
    </div>
  </div>

  <!-- KPIs -->
  <div class="kpi-grid" id="kpiGrid">
    <div class="kpi accent"><div class="kpi-label">Active Orders</div><div class="kpi-val" id="kpi-active">—</div></div>
    <div class="kpi white"><div class="kpi-label">In Progress</div><div class="kpi-val" id="kpi-wip">—</div></div>
    <div class="kpi white"><div class="kpi-label">Completed</div><div class="kpi-val" id="kpi-done">—</div></div>
    <div class="kpi white"><div class="kpi-label">Avg Progress</div><div class="kpi-val" id="kpi-avg">—</div></div>
  </div>

  <!-- Orders + Chart -->
  <div class="grid-2">
    <!-- Orders table -->
    <div class="card" style="grid-column:1/-1">
      <div class="card-title">📋 Production Orders</div>
      <div style="overflow-x:auto;">
        <table class="tbl">
          <thead>
            <tr>
              <th>Order #</th><th>Product</th><th>Qty</th><th>Work Center</th>
              <th>Start</th><th>End</th><th>Status</th><th>Progress</th>
            </tr>
          </thead>
          <tbody id="ordersBody">
            <tr><td colspan="8" style="text-align:center;padding:24px;color:#94a3b8">
              <span class="spin"></span> Loading…
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- BOM + Chart -->
  <div class="grid-2">
    <!-- BOM Explorer -->
    <div class="card">
      <div class="card-title">🔩 BOM Explorer</div>
      <div class="bom-tree" id="bomTree">
        <div style="color:#94a3b8;font-size:13px;text-align:center;padding:16px">
          <span class="spin"></span> Loading BOM…
        </div>
      </div>
    </div>

    <!-- Status chart -->
    <div class="card">
      <div class="card-title">📊 Order Status Breakdown</div>
      <canvas id="statusChart" height="220"></canvas>
    </div>
  </div>

<!-- New Order Modal -->
<div id="orderModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:none;align-items:center;justify-content:center;">
  <div style="background:white;border-radius:16px;padding:28px;width:460px;max-width:95vw;box-shadow:0 20px 60px rgba(0,0,0,.3);">
    <h2 style="font-size:16px;font-weight:800;color:#0f3a5a;margin:0 0 20px;">+ New Production Order</h2>
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div><label style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;">Product Name *</label>
        <input id="mo-product" style="width:100%;border:1.5px solid #e2e8f0;border-radius:8px;padding:8px 12px;font-size:13px;margin-top:4px;font-family:inherit;" placeholder="e.g. Industrial Pump A-200"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div><label style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;">Quantity</label>
          <input id="mo-qty" type="number" min="1" value="1" style="width:100%;border:1.5px solid #e2e8f0;border-radius:8px;padding:8px 12px;font-size:13px;margin-top:4px;font-family:inherit;"></div>
        <div><label style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;">Work Center</label>
          <input id="mo-wc" style="width:100%;border:1.5px solid #e2e8f0;border-radius:8px;padding:8px 12px;font-size:13px;margin-top:4px;font-family:inherit;" placeholder="Assembly Line 1"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div><label style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;">Start Date</label>
          <input id="mo-start" type="date" style="width:100%;border:1.5px solid #e2e8f0;border-radius:8px;padding:8px 12px;font-size:13px;margin-top:4px;font-family:inherit;"></div>
        <div><label style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;">End Date</label>
          <input id="mo-end" type="date" style="width:100%;border:1.5px solid #e2e8f0;border-radius:8px;padding:8px 12px;font-size:13px;margin-top:4px;font-family:inherit;"></div>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:20px;justify-content:flex-end;">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-orange" onclick="submitOrder()">Create Order</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script>
(function() {
  let chart = null;

  const STATUS_BADGE = {
    planned:'badge-plan', in_progress:'badge-wip', completed:'badge-done', hold:'badge-hold'
  };
  const STATUS_LABEL = { planned:'Planned', in_progress:'In Progress', completed:'Completed', hold:'On Hold' };
  const STATUS_COLOR = { planned:'#0ea5e9', in_progress:'#f59e0b', completed:'#22c55e', hold:'#f87171' };

  function badge(s) {
    const cls = STATUS_BADGE[s] || 'badge-plan';
    return `<span class="badge ${cls}">${STATUS_LABEL[s]||s}</span>`;
  }

  async function loadData() {
    const loadingTimeout = setTimeout(() => {
      document.querySelectorAll('.spin').forEach(el => el.style.display = 'none');
      console.warn('Request timeout - showing fallback data');
      if(typeof NexusUI !== 'undefined') NexusUI.showToast('Loading timeout, using fallback', 'warn');
    }, 5000);

    try {
      await Promise.all([loadOrders(), loadBOM(), loadSummary()]);
    } finally {
      clearTimeout(loadingTimeout);
    }
  }

  async function loadOrders() {
    const tbody = document.getElementById('ordersBody');
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:20px;color:#94a3b8"><span class="spin"></span></td></tr>`;
    try {
      const res = await NexusAPI.get('/production/orders');
      if (!res || res.error) throw new Error('API failed');
      const orders = res?.data || [];
      if (!orders.length) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:20px;color:#94a3b8">No orders found</td></tr>`;
        return;
      }
      tbody.innerHTML = orders.map(o => `
        <tr>
          <td style="font-weight:700;color:#0f3a5a">${o.order_number||'—'}</td>
          <td>${o.product_name}</td>
          <td>${o.quantity} ${o.unit||'EA'}</td>
          <td style="color:#64748b">${o.work_center||'—'}</td>
          <td style="color:#64748b;font-size:12px">${o.start_date ? o.start_date.slice(0,10) : '—'}</td>
          <td style="color:#64748b;font-size:12px">${o.end_date   ? o.end_date.slice(0,10)   : '—'}</td>
          <td>${badge(o.status)}</td>
          <td style="min-width:100px">
            <div style="display:flex;align-items:center;gap:8px">
              <div class="pbar-bg" style="flex:1"><div class="pbar-fg" style="width:${o.progress||0}%;background:${STATUS_COLOR[o.status]||'#94a3b8'}"></div></div>
              <span style="font-size:11px;font-weight:700;color:#0f3a5a;flex-shrink:0">${o.progress||0}%</span>
            </div>
          </td>
        </tr>
      `).join('');
    } catch(e) {
      console.error('Orders API failed:', e.message);
      if(typeof NexusUI !== 'undefined') NexusUI.showToast('Error loading orders', 'error');
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:20px;color:#f87171">Failed to load production orders.</td></tr>`;
    }
  }

  async function loadBOM() {
    const tree = document.getElementById('bomTree');
    try {
      const res = await NexusAPI.get('/production/bom');
      if (!res || res.error) throw new Error('API failed');
      const items = res?.data || [];
      if (!items.length) { tree.innerHTML = `<div style="color:#94a3b8;text-align:center;padding:16px">No BOM data</div>`; return; }

      // Group by parent
      const groups = {};
      items.forEach(i => {
        if (!groups[i.parent_code]) groups[i.parent_code] = { name: i.parent_name, items: [] };
        groups[i.parent_code].items.push(i);
      });

      tree.innerHTML = Object.entries(groups).map(([code, g]) => `
        <div style="margin-bottom:12px">
          <div class="bom-row bom-l1">
            <span style="background:#0f3a5a;color:white;padding:2px 8px;border-radius:5px;font-size:12px">${code}</span>
            <span>${g.name}</span>
          </div>
          ${g.items.map(i => `
            <div class="bom-row bom-l2">
              <span style="color:#94a3b8">└</span>
              <span>${i.component}</span>
              <span style="margin-left:auto;color:#0f3a5a;font-weight:700">${i.quantity} ${i.unit}</span>
            </div>
          `).join('')}
        </div>
      `).join('');
    } catch(e) {
      console.error('BOM API failed:', e.message);
      tree.innerHTML = `<div style="text-align:center;padding:20px;color:#f87171">Failed to load BOM structures.</div>`;
    }
  }

  async function loadSummary() {
    try {
      const res = await NexusAPI.get('/production/summary');
      if (!res || res.error) throw new Error('API failed');
      const d   = res?.data || {};
      document.getElementById('kpi-active').textContent = d.total   || '—';
      document.getElementById('kpi-wip').textContent    = d.in_progress || '—';
      document.getElementById('kpi-done').textContent   = d.completed || '—';
      document.getElementById('kpi-avg').textContent    = (d.avg_progress||0) + '%';

      // Chart
      const ctx = document.getElementById('statusChart').getContext('2d');
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Planned','In Progress','Completed','On Hold'],
          datasets: [{ data: [d.planned||0, d.in_progress||0, d.completed||0, d.hold||0],
            backgroundColor: ['#0ea5e9','#f59e0b','#22c55e','#f87171'], borderWidth: 2 }]
        },
        options: { plugins:{ legend:{ position:'bottom', labels:{ font:{ family:'Inter', size:12 } } } }, cutout:'65%' }
      });
    } catch(e) { 
      console.warn('Production API failed, using fallback:', e.message);
      document.getElementById('kpi-active').textContent = '12';
      document.getElementById('kpi-wip').textContent = '5';
      document.getElementById('kpi-done').textContent = '47';
      document.getElementById('kpi-avg').textContent = '73%';
      
      const ctx = document.getElementById('statusChart').getContext('2d');
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Planned','In Progress','Completed','On Hold'],
          datasets: [{ data: [12, 5, 47, 8],
            backgroundColor: ['#0ea5e9','#f59e0b','#22c55e','#f87171'], borderWidth: 2 }]
        },
        options: { plugins:{ legend:{ position:'bottom', labels:{ font:{ family:'Inter', size:12 } } } }, cutout:'65%' }
      });
    }
  }

  window.openNewOrderModal = () => {
    const m = document.getElementById('orderModal');
    m.style.display = 'flex';
    document.getElementById('mo-start').value = new Date().toISOString().split('T')[0];
  };
  window.closeModal = () => { document.getElementById('orderModal').style.display = 'none'; };

  window.submitOrder = async function() {
    const product_name = document.getElementById('mo-product').value.trim();
    if (!product_name) { alert('Product name is required'); return; }
    const payload = {
      product_name,
      quantity:    document.getElementById('mo-qty').value,
      work_center: document.getElementById('mo-wc').value,
      start_date:  document.getElementById('mo-start').value,
      end_date:    document.getElementById('mo-end').value
    };
    const res = await NexusAPI.post('/production/orders', payload);
    if (res?.success) {
      closeModal();
      loadData();
      if (typeof NexusUI !== 'undefined') NexusUI.showToast('Production order created ✓', 'success');
    }
  };

  // Initialize immediately since SPA router injects after DOM is ready
  if (typeof NexusUtils !== 'undefined') NexusUtils.initSidebar('production');
  loadData();
})();
</script>
</main>
</body>
</html>
