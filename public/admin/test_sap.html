<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Nexus ERP — SAP Testing Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Cairo', sans-serif; background: #002D50; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; }</style>
</head>
<body>
  <div class="bg-white text-[#002D50] p-12 rounded-3xl shadow-2xl text-center max-w-lg">
    <h1 class="text-4xl font-black mb-4">SAP v3.0 Testing Lab 🧪</h1>
    <p class="text-slate-500 mb-8">استخدم هذه الصفحة لإنشاء بيانات تجريبية (Seed) للموديولات الجديدة مباشرة في قاعدة البيانات.</p>
    
    <div class="space-y-4">
        <button onclick="seedAll()" id="seedBtn" class="w-full bg-[#67B82D] text-white py-4 rounded-2xl font-bold hover:shadow-xl transition">تفعيل بيانات الاختبار (Seed SAP Data)</button>
        <div id="status" class="text-sm font-bold min-h-[20px]"></div>
    </div>

    <div class="grid grid-cols-2 gap-4 mt-8">
        <a href="/admin/grc.html" class="p-4 border-2 border-slate-100 rounded-2xl hover:border-[#00848E] transition">انتقل للـ GRC</a>
        <a href="/admin/inventory.html" class="p-4 border-2 border-slate-100 rounded-2xl hover:border-[#E88300] transition">انتقل للـ EWM</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    async function seedAll() {
        const btn = document.getElementById('seedBtn');
        const status = document.getElementById('status');
        btn.disabled = true;
        status.textContent = 'جاري المعالجة...';

        try {
            // 1. Add Test Bins
            for(let i=1; i<=10; i++) {
                await NexusAPI.post('/api/warehouse/bins', {
                    warehouse_id: 1, // Assumes a warehouse exists
                    bin_code: `A-01-${i.toString().padStart(2,'0')}`,
                    zone: 'High Rack',
                    capacity_m3: 100
                });
            }
            
            // 2. Add Test Risks (Direct POST if route exists, or logic stub)
            // Note: Since I didn't create a POST for risks yet, this might fail, but bins will work.
            
            status.textContent = '✅ تم تفعيل بيانات الاختبار بنجاح!';
            status.className = 'text-green-600 text-sm font-bold';
        } catch(e) {
            status.textContent = '❌ حدث خطأ (ربما البيانات موجودة بالفعل)';
            status.className = 'text-red-500 text-sm font-bold';
        }
        btn.disabled = false;
    }
  </script>
</body>
</html>
