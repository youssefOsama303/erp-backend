<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus ERP — Command Center</title>
  <meta name="description" content="Nexus ERP Administration Panel — SAP-grade enterprise resource planning">
  <!-- Tailwind removed: was overriding custom CSS in injected SPA fragments -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/styles.css">
  <style>
    :root {
      --navy: #0f3a5a;
      --green: #5ba15d;
      --orange: #e57e25;
      --amber: #f5b335;
      --teal: #1b7c83;
      --light: #f4f6f9;
      --sidebar-w: 272px;
      /* Semantic tokens */
      --bg: #f4f6f9;
      --bg-card: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --input-bg: #f8fafc;
      --topbar-bg: rgba(255,255,255,0.95);
      --sidebar-bg: #0f3a5a;
    }
    body.theme-dark {
      --bg: #0d1117;
      --bg-card: #161b22;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #30363d;
      --input-bg: #21262d;
      --topbar-bg: rgba(22,27,34,0.97);
      --sidebar-bg: #010409;
    }
    body.theme-dark { background: var(--bg); color: var(--text); }
    body.theme-dark .content-area { background: var(--bg); }
    body.theme-dark .sidebar { background: var(--sidebar-bg); }
    body.theme-dark .top-header { background: var(--topbar-bg); border-color: var(--border); }
    body.theme-dark .notif-btn { background: #21262d; }
    body.theme-dark .notif-dropdown { background: #161b22; border-color: #30363d; }
    body.theme-dark .notif-dropdown li { border-color: #21262d; color: #e2e8f0; }
    body.theme-dark #globalSearch { background: #21262d; border-color: #30363d; color: #e2e8f0; }
    /* Toggle button */
    .theme-toggle {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: #f1f5f9;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      transition: background 0.2s;
    }
    .theme-toggle:hover { background: #e2e8f0; }
    body.theme-dark .theme-toggle { background: #21262d; }
    body.theme-dark .theme-toggle:hover { background: #30363d; }

    * { box-sizing: border-box; }
    body { 
      font-family: 'Inter', 'Cairo', sans-serif; 
      background: var(--light); 
      color: #1e293b; 
      overflow-x: hidden;
      margin: 0;
    }

    /* Protect injected fragment styles from any global reset */
    #content-area * { box-sizing: border-box; }
    #content-area div[style*="display:flex"],
    #content-area div[style*="display: flex"] { display: flex !important; }
    #content-area div[style*="display:grid"],
    #content-area div[style*="display: grid"] { display: grid !important; }

    /* ===== SIDEBAR ===== */
    .sidebar { 
      background: var(--navy);
      color: white; 
      width: var(--sidebar-w);
      height: 100vh; 
      position: fixed; 
      left: 0; top: 0; 
      transition: width 0.3s ease; 
      z-index: 1000; 
      box-shadow: 4px 0 20px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar.mini { width: 72px; }
    .sidebar.mini .nav-label,
    .sidebar.mini #logoText,
    .sidebar.mini .nav-header { display: none; }
    .sidebar.mini .nav-link { justify-content: center; padding: 14px; }

    .sidebar-logo { 
      padding: 24px 20px 16px; 
      display: flex; 
      align-items: center; 
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }
    .logo-icon { 
      width: 40px; height: 40px; 
      background: linear-gradient(135deg, var(--green), var(--teal));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
      font-weight: 900;
      color: white;
      letter-spacing: -1px;
    }

    .sidebar-nav { 
      flex: 1; 
      overflow-y: auto; 
      padding: 8px 0;
    }
    .sidebar-nav::-webkit-scrollbar { width: 4px; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .nav-header { 
      padding: 16px 20px 6px; 
      font-size: 10px; 
      font-weight: 700; 
      color: rgba(255,255,255,0.35); 
      text-transform: uppercase; 
      letter-spacing: 1.5px;
    }
    .nav-link { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      padding: 11px 20px; 
      color: rgba(255,255,255,0.65); 
      text-decoration: none; 
      transition: all 0.2s; 
      border-left: 3px solid transparent;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
    }
    .nav-link:hover { 
      background: rgba(255,255,255,0.06); 
      color: white; 
      border-left-color: var(--green);
    }
    .nav-link.active { 
      background: rgba(91, 161, 93, 0.15); 
      color: white; 
      border-left-color: var(--green); 
      font-weight: 700; 
    }
    .nav-link img { 
      width: 18px; height: 18px; 
      filter: invert(1) opacity(0.7);
      flex-shrink: 0;
      transition: filter 0.2s;
    }
    .nav-link:hover img,
    .nav-link.active img { filter: invert(1) opacity(1); }
    .nav-icon-fallback {
      width: 18px; height: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
    }

    .sidebar-footer { 
      padding: 16px 20px; 
      border-top: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.15);
      flex-shrink: 0;
    }
    .user-avatar { 
      width: 36px; height: 36px; 
      border-radius: 50%; 
      background: linear-gradient(135deg, var(--green), var(--teal));
      display: flex; align-items: center; justify-content: center; 
      font-weight: 700; color: white; font-size: 14px;
      flex-shrink: 0;
    }

    /* ===== MAIN LAYOUT ===== */
    .main-content { 
      margin-left: var(--sidebar-w); 
      transition: margin-left 0.3s ease; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .sidebar.mini ~ .main-content { margin-left: 72px; }

    /* ===== HEADER ===== */
    .top-header { 
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    /* ===== SEARCH ===== */
    .search-bar { 
      flex: 1; 
      max-width: 400px;
      position: relative;
    }
    .search-bar input { 
      width: 100%;
      background: #f8fafc; 
      border: 1.5px solid #e2e8f0; 
      border-radius: 10px; 
      padding: 8px 16px 8px 40px; 
      font-size: 13px;
      outline: none; 
      transition: all 0.2s;
      font-family: inherit;
    }
    .search-bar input:focus { border-color: var(--green); background: white; }
    .search-bar .search-icon {
      position: absolute;
      left: 12px; top: 50%; transform: translateY(-50%);
      color: #94a3b8;
      font-size: 15px;
      pointer-events: none;
    }

    /* ===== NOTIFICATION DROPDOWN ===== */
    .notif-wrapper { position: relative; }
    .notif-btn { 
      width: 38px; height: 38px; 
      border-radius: 10px; 
      background: #f1f5f9;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; 
      transition: background 0.2s;
      position: relative;
    }
    .notif-btn:hover { background: #e2e8f0; }
    .notif-badge { 
      position: absolute; 
      top: -2px; right: -2px; 
      width: 16px; height: 16px;
      background: #ef4444; 
      border-radius: 50%;
      border: 2px solid white;
      font-size: 9px;
      color: white;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
    }
    .notif-dropdown { 
      position: absolute; 
      top: calc(100% + 8px); 
      right: 0; 
      width: 340px;
      background: white; 
      border: 1px solid #e2e8f0; 
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12); 
      z-index: 3000;
      overflow: hidden;
      animation: dropDown 0.2s ease-out;
    }
    @keyframes dropDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .notif-dropdown.hidden { display: none; }
    .notif-header { 
      padding: 16px 20px;
      font-weight: 700; 
      font-size: 14px;
      color: var(--navy);
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .notif-mark-all {
      font-size: 11px;
      color: var(--green);
      font-weight: 600;
      cursor: pointer;
    }
    #notif-list { 
      list-style: none; 
      margin: 0; 
      padding: 8px 0; 
      max-height: 320px; 
      overflow-y: auto; 
    }
    #notif-list li { 
      padding: 12px 20px; 
      border-bottom: 1px solid #f8fafc; 
      cursor: pointer;
      transition: background 0.15s;
    }
    #notif-list li:hover { background: #f8fafc; }
    #notif-list li:last-child { border-bottom: none; }

    /* ===== CONTENT AREA ===== */
    .content-area { 
      flex: 1;
      padding: 28px 32px;
      background: var(--light);
    }

    /* ===== LOADING SPINNER ===== */
    .spa-loader {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 60vh;
    }
    .spa-loader .spinner {
      width: 40px; height: 40px;
      border: 3px solid #e2e8f0;
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== MISC ===== */
    .pulse-dot { 
      width: 8px; height: 8px; 
      background: var(--green); 
      border-radius: 50%; 
      display: inline-block; 
      animation: pulse 2s infinite; 
    }
    @keyframes pulse { 
      0%, 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(91, 161, 93, 0.7); } 
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(91, 161, 93, 0); } 
    }

    /* ===== ERROR AREA ===== */
    .error-area {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 50vh; text-align: center;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .sidebar { width: 72px; }
      .sidebar .nav-label, .sidebar #logoText, .sidebar .nav-header { display: none; }
      .sidebar .nav-link { justify-content: center; padding: 14px; }
      .main-content { margin-left: 72px; }
      .content-area { padding: 16px; }
      .top-header { padding: 0 16px; }
      .search-bar { display: none; }
    }
  </style>
</head>
<body>
  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">N</div>
      <div id="logoText">
        <div style="font-weight:900;font-size:14px;letter-spacing:-0.5px;">NEXUS ERP</div>
        <div id="tenantName" style="font-size:10px;opacity:0.45;font-weight:600;margin-top:1px;">Loading...</div>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebarNav"></nav>

    <div class="sidebar-footer">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="user-avatar" id="avatar" aria-hidden="true">?</div>
        <div style="flex:1;min-width:0;" id="userInfo">
          <div id="userName" style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" aria-live="polite">...</div>
          <div id="userRole" style="font-size:10px;opacity:0.45;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;">...</div>
        </div>
        <button onclick="logout()" title="تسجيل الخروج" aria-label="Sign out of system"
          style="background:none;border:none;color:#fca5a5;cursor:pointer;padding:6px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;border-radius:6px;margin-left:auto;"
          onmouseover="this.style.background='rgba(239,68,68,0.15)'; this.style.color='#ef4444'" 
          onmouseout="this.style.background='none'; this.style.color='#fca5a5'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ===== MAIN CONTENT ===== -->
  <div class="main-content">
    <!-- TOP HEADER -->
    <header class="top-header" role="banner">
      <!-- Left: greeting -->
      <div style="flex-shrink:0;">
        <div id="currentDate" style="font-size:11px;color:#94a3b8;font-weight:500;" aria-live="polite"></div>
        <div style="font-size:16px;font-weight:700;color:var(--navy);margin-top:1px;">
          Welcome back, <span id="helloName">Admin</span> 👋
        </div>
      </div>

      <!-- Center: search -->
      <div class="search-bar" role="search">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input type="text" id="globalSearch" placeholder="Search modules, employees, materials..." aria-label="Global search modules and items">
      </div>

      <!-- Right: actions -->
      <div style="display:flex;align-items:center;gap:12px;flex-shrink:0;">
        <div style="display:flex;align-items:center;gap:6px;background:#f0fdf4;border:1px solid #bbf7d0;padding:6px 12px;border-radius:8px;" aria-label="System status online">
          <span class="pulse-dot" aria-hidden="true"></span>
          <span style="font-size:12px;font-weight:600;color:#15803d;">System Online</span>
        </div>

        <!-- Dark/Light Mode Toggle -->
        <button class="theme-toggle" id="themeToggleBtn" onclick="NexusAdmin.toggleTheme()" title="Toggle dark/light mode" aria-label="Toggle dark/light mode">🌙</button>

        <!-- Notification Bell -->
        <div class="notif-wrapper">
          <button class="notif-btn" id="notif-bell" aria-label="Notifications">
            🔔
            <span class="notif-badge hidden" id="notif-badge">0</span>
          </button>
          <div class="notif-dropdown hidden" id="notif-dropdown">
            <div class="notif-header">
              <span>Notifications</span>
              <span class="notif-mark-all" onclick="markAllRead()">Mark all read</span>
            </div>
            <ul id="notif-list">
              <li style="padding:24px;text-align:center;color:#94a3b8;font-size:13px;">Loading...</li>
            </ul>
            <div style="padding:12px 20px;border-top:1px solid #f1f5f9;text-align:center;">
              <a href="#" style="font-size:12px;color:var(--teal);font-weight:600;text-decoration:none;">View all activity →</a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- DYNAMIC CONTENT AREA -->
    <div id="content-area" class="content-area">
      <div class="spa-loader">
        <div class="spinner"></div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Default language: English
      if (!localStorage.getItem('nexus_lang')) {
        localStorage.setItem('nexus_lang', 'en');
      }

      // Init sidebar
      NexusUtils.initSidebar('welcome.html');

      // Populate header greeting
      let user = JSON.parse(localStorage.getItem('nexus_user') || '{}');

      // ── Auto-fix admin display name to Youssef Osama Badawy ──
      if (['admin','superadmin'].includes(user.role) && user.name !== 'Youssef Osama Badawy') {
        NexusAPI.post('/admin/update-name', { name: 'Youssef Osama Badawy' })
          .then(d => {
            if (d?.success) {
              user.firstName = 'Youssef';
              user.lastName  = 'Osama Badawy';
              user.name      = 'Youssef Osama Badawy';
              localStorage.setItem('nexus_user', JSON.stringify(user));
              document.getElementById('helloName').textContent = 'Youssef';
              NexusUtils.initSidebar(location.hash.slice(1) || 'welcome.html');
            }
          })
          .catch(() => {});
      }

      const displayName = user.firstName || user.name?.split(' ')[0] || user.email?.split('@')[0] || 'Admin';
      document.getElementById('helloName').textContent = displayName;

      // Date
      document.getElementById('currentDate').textContent =
        new Date().toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    });

    function logout() { NexusUtils.logout(); }

    function markAllRead() {
      NexusAPI.patch('/activity/notifications/read-all', {}).then(() => {
        document.getElementById('notif-badge').classList.add('hidden');
        document.getElementById('notif-list').innerHTML =
          '<li style="padding:24px;text-align:center;color:#94a3b8;font-size:13px;">No unread notifications</li>';
      });
    }

    // ── Dark/Light Mode init (runs before DOMContentLoaded flicker) ──
    (function() {
      const saved = localStorage.getItem('nexus_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved === 'dark' || (!saved && prefersDark);
      if (isDark) document.body.classList.add('theme-dark');
      // Sync CSS custom prop for content-area children
      document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
    })();
  </script>
</body>
</html>
